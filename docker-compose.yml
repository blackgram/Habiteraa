services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: habitera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: habitera
      POSTGRES_PASSWORD: habitera
      POSTGRES_DB: habitera
    ports:
      - "5432:5432"
    volumes:
      - habitera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitera -d habitera"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: habitera-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  habitera_pgdata:
